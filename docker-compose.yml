
services:
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: portfolio-dev
    ports:
      - "3000:3000"
      - "3002:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --webpack --hostname 0.0.0.0
