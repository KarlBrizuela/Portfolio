<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dentalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="dentalCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#12123b" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#dentalBg)" />

  <rect x="60" y="50" width="1080" height="700" rx="20" fill="url(#dentalCard)" stroke="#6366f1" stroke-width="1.5" />
  <rect x="60" y="50" width="1080" height="60" rx="20" fill="#0d0d2b" />
  <circle cx="95" cy="80" r="7" fill="#ef4444" />
  <circle cx="120" cy="80" r="7" fill="#f59e0b" />
  <circle cx="145" cy="80" r="7" fill="#10b981" />
  <text x="600" y="86" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">dentalcombostudio.com/portal/booking</text>

  <!-- Sidebar -->
  <rect x="60" y="110" width="220" height="640" fill="#09091f" opacity="0.7" />
  <rect x="85" y="140" width="170" height="38" rx="8" fill="url(#indigoGrad)" />
  <text x="105" y="164" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🦷 Dental Studio</text>
  <text x="105" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✨ Cosmetic Dentistry</text>
  <text x="105" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📅 Treatment Booking</text>
  <text x="105" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🦷 Dental Chart Records</text>
  <text x="105" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">💳 Packages &amp; Pricing</text>
  <text x="105" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">⭐ Patient Reviews</text>

  <!-- Header -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#6366f1" opacity="0.25" />
    <text x="90" y="17" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DENTAL BOOKING STUDIO</text>
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Dental Combo Studio</text>
    <text x="0" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Aesthetic Dentistry, Oral Care &amp; Real-Time Treatment Appointment Platform</text>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(320, 265)">
    <rect x="0" y="0" width="240" height="110" rx="12" fill="#151542" stroke="#4f46e5" stroke-width="1.5" />
    <text x="20" y="35" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SCHEDULED SESSIONS</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">210</text>
    <text x="20" y="95" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">This Month's Procedures</text>

    <rect x="260" y="0" width="240" height="110" rx="12" fill="#151542" stroke="#4f46e5" stroke-width="1.5" />
    <text x="280" y="35" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">POPULAR PACKAGE</text>
    <text x="280" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Combo Glow</text>
    <text x="280" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cleaning + Whitening</text>

    <rect x="520" y="0" width="240" height="110" rx="12" fill="#151542" stroke="#4f46e5" stroke-width="1.5" />
    <text x="540" y="35" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CLIENT SATISFACTION</text>
    <text x="540" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">99.2%</text>
    <text x="540" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Based on 680+ visits</text>
  </g>

  <!-- Table -->
  <g transform="translate(320, 400)">
    <rect x="0" y="0" width="760" height="300" rx="14" fill="#0d0d2b" stroke="#4f46e5" stroke-width="1.5" />
    <text x="25" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Today's Treatment Reservations</text>
    <rect x="25" y="60" width="710" height="36" rx="6" fill="#1f1f54" />
    <text x="45" y="83" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PATIENT</text>
    <text x="220" y="83" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TREATMENT</text>
    <text x="380" y="83" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DENTIST</text>
    <text x="510" y="83" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SLOT</text>
    <text x="640" y="83" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STATUS</text>

    <text x="45" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Marvin Castillo</text>
    <text x="220" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Laser Teeth Whitening</text>
    <text x="380" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dr. J. Gomez</text>
    <text x="510" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">02:00 PM</text>
    <rect x="630" y="112" width="75" height="20" rx="10" fill="#6366f1" opacity="0.25" />
    <text x="667" y="126" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Checked-In</text>
  </g>
