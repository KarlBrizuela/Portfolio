<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="obgynBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="obgynCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2a0d24" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#obgynBg)" />

  <rect x="60" y="50" width="1080" height="700" rx="20" fill="url(#obgynCard)" stroke="#f43f5e" stroke-width="1.5" />
  <rect x="60" y="50" width="1080" height="60" rx="20" fill="#200a1b" />
  <circle cx="95" cy="80" r="7" fill="#ef4444" />
  <circle cx="120" cy="80" r="7" fill="#f59e0b" />
  <circle cx="145" cy="80" r="7" fill="#10b981" />
  <text x="600" y="86" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">clearview-obgyn.clinic/booking/appointments</text>

  <!-- Sidebar -->
  <rect x="60" y="110" width="220" height="640" fill="#170613" opacity="0.7" />
  <rect x="85" y="140" width="170" height="38" rx="8" fill="url(#roseGrad)" />
  <text x="105" y="164" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🌸 Book Appointment</text>
  <text x="105" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🤰 Prenatal Care</text>
  <text x="105" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🔍 Ultrasound Scans</text>
  <text x="105" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">👩‍⚕️ OB-GYN Specialists</text>
  <text x="105" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📅 Visit Schedules</text>
  <text x="105" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📋 Patient Medical Vault</text>

  <!-- Header -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#f43f5e" opacity="0.25" />
    <text x="85" y="17" fill="#fb7185" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CLINIC BOOKING SYSTEM</text>
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Clearview OB-GYN</text>
    <text x="0" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Obstetrics &amp; Gynecology Patient Consultation &amp; Prenatal Booking Platform</text>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(320, 265)">
    <rect x="0" y="0" width="240" height="110" rx="12" fill="#2d0f23" stroke="#e11d48" stroke-width="1.5" />
    <text x="20" y="35" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CONFIRMED VISITS</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">128</text>
    <text x="20" y="95" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">This Week's Consultations</text>

    <rect x="260" y="0" width="240" height="110" rx="12" fill="#2d0f23" stroke="#e11d48" stroke-width="1.5" />
    <text x="280" y="35" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ULTRASOUND SLOTS</text>
    <text x="280" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">94% Booked</text>
    <text x="280" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3D / 4D HD Imaging</text>

    <rect x="520" y="0" width="240" height="110" rx="12" fill="#2d0f23" stroke="#e11d48" stroke-width="1.5" />
    <text x="540" y="35" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PATIENT REVIEWS</text>
    <text x="540" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">4.9 / 5.0</text>
    <text x="540" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">520+ Patient Feedbacks</text>
  </g>

  <!-- Table -->
  <g transform="translate(320, 400)">
    <rect x="0" y="0" width="760" height="300" rx="14" fill="#190615" stroke="#e11d48" stroke-width="1.5" />
    <text x="25" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Appointment Booking Schedule</text>
    <rect x="25" y="60" width="710" height="36" rx="6" fill="#38102a" />
    <text x="45" y="83" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PATIENT NAME</text>
    <text x="220" y="83" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SERVICE</text>
    <text x="380" y="83" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PHYSICIAN</text>
    <text x="510" y="83" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TIME SLOT</text>
    <text x="640" y="83" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STATUS</text>

    <text x="45" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Patricia Villanueva</text>
    <text x="220" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Prenatal Checkup</text>
    <text x="380" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dr. C. Ramos</text>
    <text x="510" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">10:30 AM</text>
    <rect x="630" y="112" width="75" height="20" rx="10" fill="#f43f5e" opacity="0.2" />
    <text x="667" y="126" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Confirmed</text>
  </g>
</svg>
