    <text x="20" y="35" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DAILY PATIENTS</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">384</text>
    <text x="20" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Outpatient &amp; ER</text>

    <rect x="260" y="0" width="240" height="110" rx="12" fill="#082329" stroke="#0f766e" stroke-width="1.5" />
    <text x="280" y="35" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ATTENDING CLINICIANS</text>
    <text x="280" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">68 Doctors</text>
    <text x="280" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Active Shift Consultation</text>

    <rect x="520" y="0" width="240" height="110" rx="12" fill="#082329" stroke="#0f766e" stroke-width="1.5" />
    <text x="540" y="35" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BED OCCUPANCY</text>
    <text x="540" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">86.2%</text>
    <text x="540" y="95" fill="#14b8a6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Inpatient Wards</text>
  </g>

  <!-- Table -->
  <g transform="translate(320, 400)">
    <rect x="0" y="0" width="760" height="300" rx="14" fill="#041217" stroke="#0f766e" stroke-width="1.5" />
    <text x="25" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Clinical Consultations &amp; Medical Triage</text>
    <rect x="25" y="60" width="710" height="36" rx="6" fill="#0c2f38" />
    <text x="45" y="83" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PATIENT ID</text>
    <text x="200" y="83" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NAME</text>
    <text x="360" y="83" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ATTENDING</text>
    <text x="510" y="83" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DEPARTMENT</text>
    <text x="640" y="83" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STATUS</text>

    <text x="45" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">PX-2026-9021</text>
    <text x="200" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Theresa Mendoza</text>
    <text x="360" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dr. Alcantara</text>
    <text x="510" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Internal Med</text>
    <rect x="630" y="112" width="75" height="20" rx="10" fill="#10b981" opacity="0.2" />
    <text x="667" y="126" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cleared</text>
