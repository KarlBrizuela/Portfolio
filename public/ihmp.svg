<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="ihmpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0e2a3b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="ihmpCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0c232e" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#ihmpBg)" />

  <rect x="60" y="50" width="1080" height="700" rx="20" fill="url(#ihmpCard)" stroke="#0d9488" stroke-width="1.5" />
  <rect x="60" y="50" width="1080" height="60" rx="20" fill="#061c24" />
  <circle cx="95" cy="80" r="7" fill="#ef4444" />
  <circle cx="120" cy="80" r="7" fill="#f59e0b" />
  <circle cx="145" cy="80" r="7" fill="#10b981" />
  <text x="600" y="86" fill="#5eead4" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">ihmp-portal.health/emr/consultations</text>

