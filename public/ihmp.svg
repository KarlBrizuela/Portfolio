    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">IHMP</text>
    <text x="0" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Integrated Healthcare Management Platform for Clinical Workflows &amp; EMR</text>
  </g>

