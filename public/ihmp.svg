  <text x="105" y="164" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🏥 Hospital Platform</text>
  <text x="105" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📋 Patient EMR Records</text>
  <text x="105" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🩺 Doctor Schedules</text>
  <text x="105" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">🧪 Diagnostic Labs</text>
  <text x="105" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">💊 Pharmacy Inventory</text>
  <text x="105" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">💳 Insurance &amp; Billing</text>

  <!-- Header -->
