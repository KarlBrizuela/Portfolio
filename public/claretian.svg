<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Grid decoration -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="960" y1="0" x2="960" y2="800" />
  </g>

  <!-- Top App Window Bar -->
  <rect x="60" y="50" width="1080" height="700" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
  <rect x="60" y="50" width="1080" height="60" rx="20" fill="#0f172a" />
  <circle cx="95" cy="80" r="7" fill="#ef4444" />
  <circle cx="120" cy="80" r="7" fill="#f59e0b" />
  <circle cx="145" cy="80" r="7" fill="#10b981" />
  <text x="600" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">claretian-erp.edu.ph/admin/dashboard</text>

  <!-- Sidebar -->
  <rect x="60" y="110" width="220" height="640" fill="#090d16" opacity="0.6" />
  <rect x="85" y="140" width="170" height="38" rx="8" fill="url(#accentGrad)" />
  <text x="105" y="164" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">◈ Dashboard</text>
  <text x="105" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">❖ Student Records</text>
  <text x="105" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">❖ Enrollment &amp; Grading</text>
  <text x="105" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">❖ Finance &amp; Tuition</text>
  <text x="105" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">❖ Faculty Portal</text>
  <text x="105" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">❖ Settings &amp; RBAC</text>

  <!-- Main Content Header -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#dc2626" opacity="0.2" />
    <text x="55" y="17" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ERP SYSTEM</text>
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Claretian-ERP</text>
    <text x="0" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Centralized Academic &amp; Administrative Enterprise Resource Planning</text>
  </g>

  <!-- Metric KPI Cards -->
  <g transform="translate(320, 265)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="240" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ENROLLED STUDENTS</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">4,820</text>
    <text x="20" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">↑ 12% this semester</text>

    <!-- Card 2 -->
    <rect x="260" y="0" width="240" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="280" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTIVE FACULTY</text>
    <text x="280" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">248</text>
    <text x="280" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Across 14 Departments</text>

    <!-- Card 3 -->
    <rect x="520" y="0" width="240" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="540" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">COLLECTION RATE</text>
    <text x="540" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">98.4%</text>
    <text x="540" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tuition &amp; Assessment</text>
  </g>

  <!-- Large Data Table / Activity Mockup -->
  <g transform="translate(320, 400)">
    <rect x="0" y="0" width="760" height="300" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Recent Academic &amp; Enrollment Transactions</text>
    
    <!-- Table Header -->
    <rect x="25" y="60" width="710" height="36" rx="6" fill="#1e293b" />
    <text x="45" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STUDENT ID</text>
    <text x="180" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NAME</text>
    <text x="360" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROGRAM</text>
    <text x="520" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STATUS</text>
    <text x="640" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTION</text>

    <!-- Row 1 -->
    <text x="45" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">CLS-2026-0184</text>
    <text x="180" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Maria Santos</text>
    <text x="360" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">BS Info Tech</text>
    <rect x="520" y="112" width="75" height="20" rx="10" fill="#10b981" opacity="0.2" />
    <text x="557" y="126" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Enrolled</text>
    <text x="640" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">View Info</text>

    <!-- Row 2 -->
    <text x="45" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">CLS-2026-0291</text>
    <text x="180" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">John Patrick Diaz</text>
    <text x="360" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">BS Accountancy</text>
    <rect x="520" y="157" width="85" height="20" rx="10" fill="#38bdf8" opacity="0.2" />
    <text x="562" y="171" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Assessment</text>
    <text x="640" y="170" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">View Info</text>

    <!-- Row 3 -->
    <text x="45" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">CLS-2026-0312</text>
    <text x="180" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Angela Reyes</text>
    <text x="360" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">BS Education</text>
    <rect x="520" y="202" width="75" height="20" rx="10" fill="#10b981" opacity="0.2" />
    <text x="557" y="216" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Enrolled</text>
    <text x="640" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">View Info</text>
  </g>
</svg>
